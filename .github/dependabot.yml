version: 2
updates:
  # Keep the GitHub Actions in .github/workflows up to date. The actions are
  # pinned to commit SHAs; Dependabot bumps the SHA and its version comment
  # together, and batches them into a single PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
